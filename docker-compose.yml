name: mktechmonk
services:
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:6379:6379']
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['redis:/data']
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: localadmin
      MINIO_ROOT_PASSWORD: localdevelopmentonly
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['minio:/data']
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.3.2
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////data/mlflow.db --default-artifact-root /data/artifacts
    ports: ['127.0.0.1:5000:5000']
    volumes: ['mlflow:/data']
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ['./infra/local/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
    ports: ['127.0.0.1:9090:9090']
  grafana:
    image: grafana/grafana:12.1.1
    ports: ['127.0.0.1:3001:3000']
    volumes: ['grafana:/var/lib/grafana']
  ollama:
    image: ollama/ollama:0.11.10
    profiles: ['ai']
    ports: ['127.0.0.1:11434:11434']
    volumes: ['ollama:/root/.ollama']
volumes:
  redis:
  minio:
  mlflow:
  grafana:
  ollama:
