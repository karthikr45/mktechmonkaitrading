name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_local_only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PG_ADMIN_URL: postgresql://postgres:ci_local_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate && pnpm test:db && pnpm test:research
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r apps/analytics/requirements.txt
      - run: cd apps/analytics && python -m pytest && ruff check analytics tests
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
